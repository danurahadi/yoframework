# Set the project version
version=1.3

# ── Daemon ───────────────────────────────────────────────────────
# Enabled by default in Gradle 9 — kept explicit for clarity.
org.gradle.daemon=true

# ── Parallelism ──────────────────────────────────────────────────
# Run tasks in parallel across and within projects.
org.gradle.parallel=true
# Defaults to number of CPU cores. Tune per machine if needed.
org.gradle.workers.max=4
# Parallel Tooling API model builders for faster IDE sync (Gradle 9.4+).
org.gradle.tooling.parallel=true


# ── Caches ───────────────────────────────────────────────────────
# Build cache: reuse task outputs when inputs have not changed.
org.gradle.caching=true
# Configuration Cache: skip the config phase entirely on cache hits.
# This is the preferred execution mode since Gradle 9.
#org.gradle.configuration-cache=true
# If a plugin is not yet CC-compatible, set to 'warn' during migration:
# org.gradle.configuration-cache.problems=warn


# ── File-System Watching ─────────────────────────────────────────
# Keeps the VFS state in memory between builds so Gradle skips
# full directory scanning on incremental runs. On by default in
# Gradle 9 on most platforms — made explicit here.
org.gradle.vfs.watch=true


# ── Gradle Daemon JVM ────────────────────────────────────────────
# -Xmx2g  : sufficient for most Kotlin backends. Raise to 3-4g
#            for large multi-module projects.
# -Xms256m: small initial heap; the daemon grows on demand.
# -XX:MaxMetaspaceSize: caps Metaspace to avoid unbounded growth
#            under heavy annotation-processing or reflection.
# -XX:ReservedCodeCacheSize: needed for heavy JIT/K2 workloads.
#            320m is the Kotlin plugin default; 384m gives headroom.
# -XX:+HeapDumpOnOutOfMemoryError: automatic dump for OOM diagnosis.
# -Dfile.encoding=UTF-8: consistent source/resource encoding.
# -Djava.awt.headless=true: prevents AWT initialisation on servers/CI.
#
# NOTE: GC is intentionally left at JVM default (G1GC on Java 24).
#       Do not add -XX:+UseZGC here — string-deduplication in ZGC
#       had a known JDK regression in 21–24 that was fixed in JDK 25.
org.gradle.jvmargs=-Xmx2g \
    -Xms1g \
    -XX:MaxMetaspaceSize=512m \
    -XX:ReservedCodeCacheSize=384m \
    -XX:+HeapDumpOnOutOfMemoryError \
    -XX:HeapDumpPath=./heap-dump.hprof \
    -Dfile.encoding=UTF-8 \
    -Djava.awt.headless=true


# ── Kotlin Daemon JVM ────────────────────────────────────────────
# The K2 compiler runs in its own daemon, separate from the Gradle
# daemon. These args target only the Kotlin compiler process.
# Space-separated standard JVM flags (not the legacy comma-separated
# -Dkotlin.daemon.jvm.options syntax).
kotlin.daemon.jvmargs=-Xmx1500m \
    -Xms512m \
    -XX:MaxMetaspaceSize=384m \
    -XX:ReservedCodeCacheSize=320m


# ── Kotlin ───────────────────────────────────────────────────────
# Enforce the official Kotlin code style (K2-aware formatter rules).
kotlin.code.style=official
# Write Kotlin build performance reports to build/reports/kotlin-build/.
# Low overhead; invaluable for diagnosing slow incremental compilation.
kotlin.build.report.output=file


# ── CI / Non-Interactive (Gradle 9.6+) ───────────────────────────
# Disable all interactive console prompts in automated environments.
# Uncomment on CI runners; leave commented on developer machines.
org.gradle.console.interactive=false

